<!DOCTYPE html>
<!--
  WorkBuddy 实时状态监控台
  ------------------------------------------------------------
  方式一（推荐，真实数据）：双击 start.bat 或在命令行执行
      node monitor-server.mjs --open
  方式二（直接打开本文件）：未连接本地服务时自动进入「演示模式」，
      点右下角「重新连接」可在服务启动后切回实时数据。
-->
<html lang="zh-CN" data-status="idle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy · 实时状态监控</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f6fa;
    --panel:#ffffff;
    --ink:#0f172a;
    --ink-2:#334155;
    --muted:#7c8aa0;
    --line:#e8ebf2;
    --c:#94a3b8;
    --c-soft:rgba(148,163,184,.13);
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 32px -18px rgba(15,23,42,.28);
    --radius:20px;
  }
  html[data-status="thinking"]{--c:#7c5cfc;--c-soft:rgba(124,92,252,.12)}
  html[data-status="working"]{--c:#0ea5e9;--c-soft:rgba(14,165,233,.12)}
  html[data-status="standby"]{--c:#10b981;--c-soft:rgba(16,185,129,.13)}
  html[data-status="idle"]{--c:#94a3b8;--c-soft:rgba(148,163,184,.14)}
  html[data-status="error"]{--c:#ef4444;--c-soft:rgba(239,68,68,.13)}

  html,body{height:100%}
  body{
    font-family:"Inter","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    padding:26px clamp(16px,3vw,44px) 34px;
    position:relative;overflow-x:hidden;
    transition:background .5s ease;
  }
  /* 背景光晕 */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;transition:background .8s ease}
  .b1{width:52vw;height:52vw;left:-14vw;top:-20vw;background:var(--c-soft)}
  .b2{width:46vw;height:46vw;right:-12vw;bottom:-22vw;background:linear-gradient(140deg,var(--c-soft),rgba(255,255,255,0))}
  .grid-lines{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(15,23,42,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.028) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
  }

  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(145deg,#0f172a,#2b3a55);color:#fff;
    font-weight:800;font-size:15px;letter-spacing:.5px;
    box-shadow:0 10px 22px -12px rgba(15,23,42,.7),inset 0 1px 0 rgba(255,255,255,.22);
  }
  .brand h1{font-size:19px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:baseline;gap:8px}
  .brand h1 em{font-style:normal;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
  .brand p{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.9px;text-transform:uppercase;font-weight:500}
  .top-right{display:flex;align-items:center;gap:12px}
  .conn{
    display:flex;align-items:center;gap:8px;padding:8px 14px 8px 11px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
    font-size:12.5px;font-weight:600;color:var(--ink-2);transition:.3s;
  }
  .conn i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;box-shadow:0 0 0 3px rgba(203,213,225,.25)}
  .conn[data-mode="live"] i{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.18);animation:blink 2s infinite}
  .conn[data-mode="demo"] i{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18);animation:blink 1.2s infinite}
  .conn[data-mode="live"]{color:#047857}
  .conn[data-mode="demo"]{color:#b45309;background:#fffbeb;border-color:#fde68a}
  .clock{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;font-weight:600;
    color:var(--ink-2);padding:8px 14px;border-radius:999px;background:var(--panel);
    border:1px solid var(--line);box-shadow:var(--shadow);font-variant-numeric:tabular-nums;
  }

  /* ---------- layout ---------- */
  .ctx{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    padding:14px 20px;margin-bottom:16px;position:relative;overflow:hidden;
  }
  .ctx::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--c),transparent);opacity:.75;transition:background .5s;
  }
  .ctx-item{min-width:0;flex:1 1 200px}
  .ctx-k{
    font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);
    font-weight:700;display:flex;align-items:center;gap:6px;
  }
  .ctx-k .ic{width:6px;height:6px;border-radius:2px;background:var(--c);opacity:.75}
  .ctx-v{font-size:14px;font-weight:700;margin-top:5px;letter-spacing:-.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .ctx-sub{
    font-family:ui-monospace,Menlo,monospace;font-size:10.8px;color:#9aa6b8;
    margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    direction:rtl;text-align:left;
  }
  .ctx-div{width:1px;align-self:stretch;background:var(--line);flex:0 0 auto;min-height:34px}
  .chips{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-start;flex:1 1 100%;overflow:hidden;padding-top:12px;margin-top:2px;border-top:1px dashed rgba(15,23,42,.06)}
  .chip{
    font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:default;
    background:#f4f6fa;color:#64748b;border:1px solid transparent;max-width:150px;flex:0 0 auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.2s;
  }
  .chip.on{background:var(--c-soft);color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
  .chip.more{background:transparent;border:1px dashed #dfe4ec;color:#a8b3c4}

  .grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* ---------- stage ---------- */
  .stage{
    position:relative;padding:30px 34px;display:flex;align-items:center;gap:34px;
    overflow:hidden;min-height:264px;
  }
  .stage::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 150% at 12% 0%,var(--c-soft),transparent 62%);
    transition:background .6s ease;
  }
  .stage::after{
    content:"";position:absolute;left:34px;right:34px;bottom:0;height:2px;
    background:linear-gradient(90deg,var(--c),transparent);opacity:.5;
  }

  .orb{position:relative;width:196px;height:196px;flex:0 0 auto;display:grid;place-items:center}
  .core{
    width:92px;height:92px;border-radius:50%;position:relative;transition:all .45s cubic-bezier(.4,0,.2,1);
    background:radial-gradient(circle at 33% 28%,#fff 0%,var(--c) 46%,color-mix(in srgb,var(--c) 62%,#000) 100%);
    box-shadow:0 0 0 12px var(--c-soft),0 22px 44px -16px color-mix(in srgb,var(--c) 70%,transparent);
  }
  .core .glow{
    position:absolute;inset:-9px;border-radius:50%;background:var(--c);filter:blur(20px);opacity:.4;
    animation:breathe 2.6s ease-in-out infinite;
  }
  .ring{position:absolute;width:196px;height:196px;border-radius:50%;border:1.4px solid var(--c);opacity:0}
  [data-status="working"] .ring,[data-status="thinking"] .ring{animation:ripple 3s cubic-bezier(.22,.61,.36,1) infinite}
  .r2{animation-delay:1s!important}.r3{animation-delay:2s!important}
  [data-status="working"] .ring{border-style:dashed}
  .sweep{
    position:absolute;width:196px;height:196px;border-radius:50%;opacity:0;
    background:conic-gradient(from 0deg,transparent 0 68%,color-mix(in srgb,var(--c) 55%,transparent) 92%,transparent 100%);
    mask:radial-gradient(circle,transparent 62%,#000 63%);
    transition:opacity .4s;
  }
  [data-status="working"] .sweep{opacity:1;animation:spin 1.6s linear infinite}
  [data-status="thinking"] .orb{animation:floaty 3.4s ease-in-out infinite}

  .statusText{min-width:0;flex:1}
  .eyebrow{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
  .label{
    font-size:clamp(40px,5.4vw,58px);font-weight:800;letter-spacing:-2px;line-height:1;
    color:var(--ink);display:flex;align-items:center;gap:14px;transition:color .4s;
  }
  .label .dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px var(--c-soft);flex:0 0 auto}
  .en{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:3.4px;color:var(--c);font-weight:700;margin-top:11px}
  .detail{
    margin-top:15px;font-size:14.5px;color:var(--ink-2);line-height:1.55;max-width:46ch;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:22px;
  }
  .detail code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--c-soft);color:var(--c);
    padding:2px 7px;border-radius:6px;font-weight:600}

  .meters{position:absolute;right:34px;top:30px;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
  .meter{display:flex;align-items:baseline;gap:9px;font-size:11px;color:var(--muted);letter-spacing:.4px}
  .meter b{font-family:ui-monospace,Menlo,monospace;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}

  /* ---------- side ---------- */
  .side{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:stretch}
  .stat{padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;min-height:84px}
  .stat span{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.4px}
  .stat b{font-size:26px;font-weight:750;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.15}
  .stat b.sm{font-size:15px;letter-spacing:-.2px;word-break:break-word;line-height:1.3}
  .rhythm{grid-column:1/-1;padding:18px 20px 16px}
  .rhythm .rh-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .rhythm .rh-head span{font-size:11.5px;color:var(--muted);font-weight:600}
  .rhythm .rh-head i{font-style:normal;font-size:10.5px;color:#a8b3c4;letter-spacing:.5px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:52px}
  .bars i{flex:1;border-radius:3px 3px 1px 1px;background:#eef1f6;min-height:5px;transition:height .45s ease,background .45s ease}
  .bars i.on{background:var(--c)}

  /* ---------- timeline ---------- */
  .timeline{padding:20px 22px 8px}
  .tl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .tl-head h2{font-size:13.5px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
  .tl-head h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--c)}
  .tl-head span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tl-list{list-style:none;max-height:302px;overflow-y:auto;padding-right:6px;scrollbar-width:thin}
  .tl-list::-webkit-scrollbar{width:5px}
  .tl-list::-webkit-scrollbar-thumb{background:#dde3ec;border-radius:9px}
  .tl-item{
    display:grid;grid-template-columns:62px 78px minmax(0,1fr);gap:12px;align-items:start;
    padding:10px 6px;border-radius:10px;border-bottom:1px dashed rgba(15,23,42,.055);
    font-size:13px;color:var(--ink-2);
  }
  .tl-item:last-child{border-bottom:0}
  .tl-item.fresh{animation:slideIn .45s cubic-bezier(.22,.61,.36,1);background:var(--c-soft)}
  .tl-time{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#9aa6b8;font-variant-numeric:tabular-nums;padding-top:2px}
  .tag{
    font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:6px;
    text-align:center;white-space:nowrap;
  }
  .tag.user{background:#eef2ff;color:#4f46e5}
  .tag.think{background:#f3efff;color:#7c5cfc}
  .tag.tool{background:#e6f6fe;color:#0284c7}
  .tag.result{background:#eefaf3;color:#059669}
  .tag.reply{background:#f1f5f9;color:#475569}
  .tag.error{background:#fef2f2;color:#dc2626}
  .tl-text{min-width:0;line-height:1.5;overflow-wrap:anywhere}
  .tl-text code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f1f4f9;padding:1px 5px;border-radius:4px;color:#334155}
  .empty{padding:34px 8px;text-align:center;color:#a3aec0;font-size:13px}

  /* ---------- footer ---------- */
  footer{
    margin-top:18px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;
    font-size:11.5px;color:#93a0b4;padding:0 4px;
  }
  footer .src{font-family:ui-monospace,Menlo,monospace;font-size:10.8px;color:#a8b3c4;
    max-width:52ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  footer .sep{flex:1}
  .ghost{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:11.5px;font-weight:600;
    padding:7px 13px;border-radius:9px;cursor:pointer;transition:.2s;font-family:inherit;
  }
  .ghost:hover{border-color:var(--c);color:var(--c);background:var(--c-soft)}
  .ghost.active{background:var(--c);border-color:var(--c);color:#fff}

  /* ---------- animations ---------- */
  @keyframes ripple{0%{transform:scale(.46);opacity:.85}70%{opacity:.12}100%{transform:scale(1);opacity:0}}
  @keyframes breathe{0%,100%{opacity:.32;transform:scale(.94)}50%{opacity:.55;transform:scale(1.06)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

  @media (max-width:940px){
    .grid{grid-template-columns:1fr}
    .meters{position:static;flex-direction:row;gap:20px;margin-top:20px;justify-content:flex-start}
    .stage{flex-direction:column;text-align:center;align-items:center;padding:28px 22px}
    .detail{max-width:100%}
    .label{justify-content:center}
    .tl-item{grid-template-columns:52px 68px minmax(0,1fr);gap:8px}
    .stat b{font-size:22px}
  }
</style>
</head>
<body>
<div class="bg"><span class="blob b1"></span><span class="blob b2"></span></div>
<div class="grid-lines"></div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">WB</div>
      <div>
        <h1>WorkBuddy <em>实时状态监控</em></h1>
        <p>Agent Activity Monitor</p>
      </div>
    </div>
    <div class="top-right">
      <div class="conn" id="conn" data-mode="wait"><i></i><span id="connText">连接中…</span></div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </header>

  <section class="card ctx">
    <div class="ctx-item">
      <div class="ctx-k"><i class="ic"></i>Project 项目</div>
      <div class="ctx-v" id="projName">—</div>
      <div class="ctx-sub" id="projPath">等待识别工作目录…</div>
    </div>
    <div class="ctx-div"></div>
    <div class="ctx-item">
      <div class="ctx-k"><i class="ic"></i>Session 当前会话</div>
      <div class="ctx-v" id="sessTitle">—</div>
      <div class="ctx-sub" id="sessDir">—</div>
    </div>
    <div class="chips" id="projChips"></div>
  </section>

  <main class="grid">
    <section class="card stage">
      <div class="orb" id="orb">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="sweep"></div>
        <div class="core"><div class="glow"></div></div>
      </div>
      <div class="statusText">
        <div class="eyebrow">Current Status</div>
        <div class="label"><span class="dot"></span><span id="label">空闲</span></div>
        <div class="en" id="en">IDLE</div>
        <div class="detail" id="detail">正在等待新的指令…</div>
      </div>
      <div class="meters">
        <div class="meter"><span>本状态</span><b id="mStatus">00:00</b></div>
        <div class="meter"><span>会话</span><b id="mSession">00:00</b></div>
      </div>
    </section>

    <aside class="side">
      <div class="card stat"><span>推理步数</span><b id="sStep">0</b></div>
      <div class="card stat"><span>工具调用</span><b id="sTool">0</b></div>
      <div class="card stat"><span>事件总数</span><b id="sEvent">0</b></div>
      <div class="card stat"><span>运行模型</span><b class="sm" id="sModel">—</b></div>
      <div class="card rhythm">
        <div class="rh-head"><span>活动节律 · 最近 3 分钟</span><i id="rhHint">IDLE</i></div>
        <div class="bars" id="rhythm"></div>
      </div>
    </aside>
  </main>

  <section class="card timeline">
    <div class="tl-head"><h2>实时事件流</h2><span id="tlCount">0 条</span></div>
    <ol class="tl-list" id="tl"><li class="empty">等待事件…</li></ol>
  </section>

  <footer>
    <span id="srcLabel">数据源</span>
    <span class="src" id="src">—</span>
    <span class="sep"></span>
    <span id="sessionId">—</span>
    <button class="ghost" id="btnDemo">演示模式</button>
    <button class="ghost" id="btnReconnect">重新连接</button>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var API = "http://127.0.0.1:8787";

  var STATUS = {
    thinking:{label:"思考中", en:"THINKING",   hint:"模型正在推理与规划下一步"},
    working: {label:"工作中", en:"WORKING",    hint:"正在执行工具调用"},
    standby: {label:"待命中", en:"STANDING BY", hint:"本轮回复已完成，随时可以继续"},
    idle:    {label:"空闲",   en:"IDLE",       hint:"正在等待新的指令…"},
    error:   {label:"异常",   en:"ERROR",      hint:"最近一次操作失败"}
  };

  var TAGS = {user:"指令", think:"思考", tool:"工具", result:"结果", reply:"回复", error:"异常", session:"会话"};

  var state = {
    status:"idle", statusSince:Date.now(), detail:"", model:"", sessionId:"", cwd:"", file:"",
    sessionStart:0, stepSeq:0, toolCount:0, eventTotal:0, lastEventTs:0, events:[],
    title:"", sessionDir:"", project:{name:"", path:"", dir:"", dirPath:""},
    projects:[], projectCount:0
  };

  var demo = false, demoTimer = null, es = null, connState = "wait";
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- utils ---------- */
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function dur(ms){
    if(!ms || ms < 0) return "00:00";
    var s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
    return h > 0 ? h+":"+pad(m)+":"+pad(ss) : pad(m)+":"+pad(ss);
  }
  function clockStr(d){ return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------- render ---------- */
  function render(){
    var meta = STATUS[state.status] || STATUS.idle;
    document.documentElement.setAttribute("data-status", state.status);

    $("label").textContent = meta.label;
    $("en").textContent = meta.en;

    var d = state.detail || meta.hint;
    $("detail").textContent = d;

    renderContext();

    $("sStep").textContent  = state.stepSeq || 0;
    $("sTool").textContent  = state.toolCount || 0;
    $("sEvent").textContent = state.eventTotal || state.events.length || 0;
    $("sModel").textContent = state.model || "—";
    $("rhHint").textContent = meta.en;

    $("src").textContent = state.file || "本地会话轨迹 (.jsonl)";
    $("sessionId").textContent = state.sessionId ? ("会话 " + state.sessionId.slice(0,8)) : "—";

    renderTimeline();
    renderRhythm();
  }

  function renderContext(){
    var p = state.project || {};
    var name = p.name || "未识别";
    var sub  = p.path || p.dirPath || "等待识别工作目录…";
    $("projName").textContent = name;
    $("projName").title = p.path || "";
    $("projPath").textContent = sub;
    $("projPath").title = sub;

    $("sessTitle").textContent = state.title || (state.sessionId ? "未命名会话" : "—");
    $("sessTitle").title = state.title || "";
    var sd = state.sessionDir || (state.sessionId ? "…/" + state.sessionId.slice(0,8) : "—");
    $("sessDir").textContent = sd;
    $("sessDir").title = sd;

    var chips = "";
    var list = state.projects || [];
    for(var i = 0; i < list.length && i < 4; i++){
      var pr = list[i];
      chips += '<span class="chip' + (pr.active ? " on" : "") + '" title="' +
               esc(pr.path || pr.name) + '">' + esc(pr.name) + (pr.active ? " ●" : "") + '</span>';
    }
    if(state.projectCount > 4) chips += '<span class="chip more">+' + (state.projectCount - 4) + '</span>';
    $("projChips").innerHTML = chips;
  }

  function renderTimeline(){
    var list = state.events;
    $("tlCount").textContent = list.length + " 条";
    if(!list.length){
      $("tl").innerHTML = '<li class="empty">等待事件…</li>';
      return;
    }
    var html = "";
    for(var i = 0; i < list.length && i < 40; i++){
      var e = list[i];
      var dt = new Date(e.t);
      html += '<li class="tl-item' + (i === 0 ? " fresh" : "") + '">' +
                '<span class="tl-time">' + clockStr(dt) + '</span>' +
                '<span class="tag ' + esc(e.kind) + '">' + (TAGS[e.kind] || "事件") + '</span>' +
                '<span class="tl-text">' + esc(e.text) + '</span>' +
              '</li>';
    }
    $("tl").innerHTML = html;
  }

  var BARS = 34;
  function renderRhythm(){
    var el = $("rhythm");
    if(!el.children.length){
      var f = "";
      for(var i = 0; i < BARS; i++) f += "<i></i>";
      el.innerHTML = f;
    }
    var now = Date.now(), span = 180000, step = span / BARS;
    var buckets = new Array(BARS).fill(0);
    state.events.forEach(function(e){
      var age = now - e.t;
      if(age < 0 || age > span) return;
      var idx = BARS - 1 - Math.floor(age / step);
      if(idx >= 0 && idx < BARS) buckets[idx]++;
    });
    var max = Math.max.apply(null, buckets.concat([1]));
    for(var j = 0; j < BARS; j++){
      var bar = el.children[j];
      var v = buckets[j];
      bar.style.height = v ? (16 + (v / max) * 34) + "px" : "4px";
      bar.classList.toggle("on", v > 0);
      bar.style.opacity = v ? 1 : .55;
    }
  }

  function setConn(mode, text){
    connState = mode;
    var c = $("conn");
    c.setAttribute("data-mode", mode);
    $("connText").textContent = text;
  }

  function tick(){
    var now = new Date();
    $("clock").textContent = clockStr(now);
    $("mStatus").textContent = dur(Date.now() - state.statusSince);
    $("mSession").textContent = state.sessionStart ? dur(Date.now() - state.sessionStart) : "00:00";
    // 本地兜底：长时间无事件则自动回落为空闲
    if(!demo && state.lastEventTs){
      var age = Date.now() - state.lastEventTs;
      var want = state.status;
      if(age > 25000 && (state.status === "thinking" || state.status === "working")) want = "idle";
      if(want !== state.status){
        state.status = want;
        state.statusSince = Date.now() - Math.min(age, 25000);
        state.detail = "";
        render();
      }
    }
    renderRhythm();
  }
  setInterval(tick, 500);

  /* ---------- 服务端状态 ---------- */
  function applyServer(p){
    if(demo) return;
    var prevStatus = state.status;
    state.status      = p.status || "idle";
    state.statusSince = p.statusSince || Date.now();
    state.detail      = p.detail || "";
    state.model       = p.model || state.model;
    state.sessionId   = p.sessionId || state.sessionId;
    state.cwd         = p.cwd || state.cwd;
    state.file        = p.file || state.file;
    state.sessionStart= p.sessionStart || state.sessionStart;
    state.stepSeq     = p.stepSeq || 0;
    state.toolCount   = p.toolCount || 0;
    state.eventTotal  = p.eventTotal || 0;
    state.title       = p.title || state.title;
    state.sessionDir  = p.sessionDir || "";
    state.project     = p.project || state.project;
    state.projects    = Array.isArray(p.projects) ? p.projects : [];
    state.projectCount= p.projectCount || state.projects.length;
    state.lastEventTs = p.lastEventTs || state.lastEventTs;
    state.events      = Array.isArray(p.events) ? p.events : [];
    if(state.status !== prevStatus) state.statusSince = p.statusSince || Date.now();
    render();
  }

  function connect(){
    if(es){ try{ es.close(); }catch(e){} }
    setConn("wait", "连接中…");
    try{
      es = new EventSource(API + "/events");
    }catch(e){
      startDemo("浏览器不支持实时连接");
      return;
    }
    es.onopen = function(){
      setConn("live", "实时连接");
      $("btnDemo").classList.remove("active");
      $("btnDemo").textContent = "演示模式";
    };
    es.onmessage = function(ev){
      var data;
      try{ data = JSON.parse(ev.data); }catch(e){ return; }
      if(data.type === "state"){
        stopDemo();
        setConn("live", "实时连接");
        applyServer(data);
      }
    };
    es.onerror = function(){
      if(connState !== "live" && !demo) startDemo("未连接本地监控服务");
    };
  }

  /* ---------- 演示模式 ---------- */
  var DEMO_SEQ = [
    {status:"thinking", kind:"think",  text:"正在分析需求并规划执行步骤…"},
    {status:"working",  kind:"tool",   text:"调用 Bash · 扫描项目文件结构"},
    {status:"working",  kind:"result", text:"Bash 执行完成 · 用时 1.2s"},
    {status:"thinking", kind:"think",  text:"根据检索结果继续推理…"},
    {status:"working",  kind:"tool",   text:"调用 Read · index.html"},
    {status:"working",  kind:"result", text:"Read 返回 428 行"},
    {status:"standby",  kind:"reply",  text:"已完成页面渲染，等待下一步指令"}
  ];
  var demoIdx = 0;

  function startDemo(reason){
    if(demo) return;
    demo = true;
    setConn("demo", "演示模式 · " + (reason || "模拟数据"));
    $("btnDemo").classList.add("active");
    $("btnDemo").textContent = "退出演示";
    state.file = "演示数据（未连接 monitor-server.mjs）";
    state.project = {
      name:"wb_status_pc",
      path:"D:////workbuddy_space////holocubic_ws////wb_status_pc",
      dir:"d-workbuddy_space-holocubic_ws-wb_status_pc",
      dirPath:"~/.workbuddy/projects/d-workbuddy_space-holocubic_ws-wb_status_pc"
    };
    state.title = "实时监控 WorkBuddy 状态的 HTML 页面";
    state.sessionDir = "~/.workbuddy/projects/d-workbuddy_space-holocubic_ws-wb_status_pc/demo-0000";
    state.projects = [
      {name:"wb_status_pc", path:"D:////workbuddy_space////holocubic_ws////wb_status_pc", active:true},
      {name:"grade6", path:"D:////workbuddy_space////grade6", active:false},
      {name:"shici", path:"D:////workbuddy_space////shici", active:false}
    ];
    state.projectCount = 3;
    state.model = state.model || "DeepSeek-V4.1-Flash";
    state.sessionStart = Date.now() - 4 * 60000;
    state.stepSeq = 0; state.toolCount = 0; state.eventTotal = 0; state.events = [];
    demoIdx = 0;
    pushDemo();
    demoTimer = setInterval(pushDemo, 2200);
  }

  function pushDemo(){
    var step = DEMO_SEQ[demoIdx % DEMO_SEQ.length];
    demoIdx++;
    var t = Date.now();
    state.events.unshift({t:t, kind:step.kind, text:step.text});
    if(state.events.length > 40) state.events.length = 40;
    state.eventTotal++;
    state.status = step.status;
    state.statusSince = t;
    state.lastEventTs = t;
    state.detail = step.text;
    if(step.kind === "tool") state.toolCount++;
    if(step.kind === "think") state.stepSeq++;
    render();
  }

  function stopDemo(){
    if(!demo) return;
    demo = false;
    clearInterval(demoTimer); demoTimer = null;
    $("btnDemo").classList.remove("active");
    $("btnDemo").textContent = "演示模式";
  }

  /* ---------- 交互 ---------- */
  $("btnDemo").onclick = function(){
    if(demo){ stopDemo(); connect(); }
    else startDemo("手动开启");
  };
  $("btnReconnect").onclick = function(){
    stopDemo();
    connect();
  };

  render();
  connect();
})();
</script>
</body>
</html>
